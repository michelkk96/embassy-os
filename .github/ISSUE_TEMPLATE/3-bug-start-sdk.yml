name: 📦 Start SDK — Bug Report
description: A defect in `@start9labs/start-sdk` — packaging a service, or the effects API at runtime.
type: Bug
labels: [StartSDK]
assignees:
  - MattDHill
body:
  - type: markdown
    attributes:
      value: |
        **Filing this with an agent?** `gh issue create` bypasses this form entirely — pass the metadata yourself with `--type Bug --label StartSDK`, and mirror the `###` headings below as your body's sections. Title the issue as the *finding*, not the symptom alone: `<what breaks> — <why> (<file:line>)`.

        Packaging *questions* belong in the [developer Matrix room](https://matrix.to/#/#developer-space:matrix.start9labs.com); this form is for SDK defects.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched [existing issues](https://github.com/Start9Labs/start-technologies/issues?q=is%3Aissue) and this is not already reported.
          required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: From your package's `package.json`, or `npm ls @start9labs/start-sdk`.
      placeholder: 2.0.10
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it fail?
      options:
        - s9pk build / pack
        - Manifest & versioning
        - Effects API at runtime
        - Health checks
        - Actions & inputs
        - Dependencies
        - Backups
        - Interfaces & addresses
        - Mounts & volumes
        - TypeScript types / osBindings
        - Packaging documentation
        - Other / unsure
    validations:
      required: true

  - type: input
    id: package
    attributes:
      label: Package being built
      description: The service you are packaging, and its repo if public.
      placeholder: bitcoind-startos (Start9Labs/bitcoind-startos)

  - type: input
    id: os-version
    attributes:
      label: StartOS version it runs on
      description: Only needed if the failure is at runtime rather than build time.
      placeholder: 0.4.0.2

  - type: input
    id: node
    attributes:
      label: Node version
      description: '`node --version`'
      placeholder: v22.11.0

  - type: textarea
    id: current
    attributes:
      label: What happens
      description: Include the SDK call involved and the error it produces.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen instead
      description: If the SDK's own documentation says otherwise, link the page — a docs/behavior mismatch is a bug in one of them.
    validations:
      required: true

  - type: textarea
    id: snippet
    attributes:
      label: Minimal reproduction
      description: The smallest snippet from your package that triggers it.
      render: typescript

  - type: textarea
    id: root-cause
    attributes:
      label: Root cause / code pointers
      description: If you traced it, name the file, the line, and the mechanism. The SDK source is `projects/start-sdk/lib/`; shared types come from `shared-libs/ts-modules/start-core/`.
      placeholder: |
        `projects/start-sdk/lib/backup/Backups.ts:88` — the `cp` runs through `exec`, which carries a default 30 s timeout, so any dump larger than that window is SIGKILLed mid-copy.

  - type: textarea
    id: logs
    attributes:
      label: Logs & evidence
      description: Build output, or the service log from the running package.
      render: shell
